<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pixel tracking heuristic test resource</title>
</head>

<body>
  <span id="main"></span>
  <script>
// create and set the tracking cookie
let tracking_cookie = "somekey=418299633.1535508492";
document.cookie = tracking_cookie;

// detect url query params for whether or not to load the img w/ cookie substring
let urlParams = new URLSearchParams(window.location.search);

// set up img tag, src, and cookie substring
let imgEl = document.createElement("img");
let img_src = "https://res.cloudinary.com/jerrick/image/upload/w_768/a3e47wjih6jh8ilxwxcz"

// if url parameter passed in, load img with cookie val in querystring
if (urlParams.get("trackMe") === "true") {
  imgEl.src = img_src + "?cookie=" + tracking_cookie.split('=')[1];
} else {
  imgEl.src = img_src;
};

// place img tag on page
document.getElementById("main").appendChild(imgEl);
  </script>
</body>
</html>
